name: Self-test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  helper-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Test target resolution helper
        run: python -m unittest discover -s tests -v

  # ───────────────────────────────────────────────────────────────────
  # Scenario 1: tests import the source tree directly (directory input)
  # ───────────────────────────────────────────────────────────────────
  directory-mode:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - analysis: dynapyt.analyses.CallGraph.CallGraph
            trace_file: dynapyt.json
            slug: callgraph
          - analysis: dynapyt.analyses.TraceAll.TraceAll
            trace_file: output.log
            slug: traceall
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create sample package and tests
        run: |
          mkdir -p sample_pkg tests
          cat > sample_pkg/__init__.py <<'EOF'
          def add(a, b):
              return helper(a) + helper(b)

          def helper(x):
              return x * 2
          EOF
          cat > tests/test_sample.py <<'EOF'
          import sample_pkg

          def test_add():
              assert sample_pkg.add(2, 3) == 10
          EOF
          # Ensure the workspace root is on sys.path so the tests can
          # import sample_pkg without installing it.
          touch conftest.py
          pip install pytest

      - name: Setup DynaPyt (directory mode)
        uses: ./
        with:
          directory: "sample_pkg"
          analysis: ${{ matrix.analysis }}

      - name: Run tests
        run: pytest tests/

      - name: Collect & upload traces
        if: always()
        uses: ./
        with:
          mode: collect
          artifact-name: selftest-directory-${{ matrix.slug }}

      - name: Verify traces are non-empty
        run: |
          FILE="$DYNAPYT_OUTPUT_DIR/${{ matrix.trace_file }}"
          echo "Checking $FILE"
          if [ ! -s "$FILE" ]; then
            echo "::error::Trace file $FILE is missing or empty."
            exit 1
          fi
          if ! grep -q "helper" "$FILE"; then
            echo "::error::Trace file $FILE does not mention the instrumented function 'helper'."
            cat "$FILE"
            exit 1
          fi
          echo "OK — trace contains instrumented calls:"
          head -c 500 "$FILE"; echo

  # ───────────────────────────────────────────────────────────────────
  # Scenario 2: project installed non-editably before tests, so tests
  # import from site-packages (package input). Mirrors wheel-based CI.
  # ───────────────────────────────────────────────────────────────────
  package-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create, install, then hide the sample package
        run: |
          mkdir -p sample_pkg tests
          cat > sample_pkg/__init__.py <<'EOF'
          def add(a, b):
              return helper(a) + helper(b)

          def helper(x):
              return x * 2
          EOF
          cat > pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "sample-pkg"
          version = "0.1"

          [tool.setuptools]
          packages = ["sample_pkg"]
          EOF
          cat > tests/test_sample.py <<'EOF'
          import sample_pkg

          def test_add():
              assert sample_pkg.add(2, 3) == 10
          EOF
          pip install pytest
          pip install .
          # Move the source tree aside so imports can only resolve to
          # site-packages — same situation as a wheel-based workflow.
          mv sample_pkg sample_pkg_src
          python -c "import sample_pkg; print('imports from:', sample_pkg.__file__)"

      - name: Setup DynaPyt (package mode)
        uses: ./
        with:
          package: "sample_pkg"

      - name: Run tests
        run: pytest tests/

      - name: Collect & upload traces
        if: always()
        uses: ./
        with:
          mode: collect
          artifact-name: selftest-package-callgraph

      - name: Verify traces are non-empty
        run: |
          FILE="$DYNAPYT_OUTPUT_DIR/dynapyt.json"
          echo "Checking $FILE"
          if [ ! -s "$FILE" ]; then
            echo "::error::Trace file $FILE is missing or empty."
            exit 1
          fi
          if ! grep -q "helper" "$FILE"; then
            echo "::error::Trace file $FILE does not mention the instrumented function 'helper'."
            cat "$FILE"
            exit 1
          fi
          echo "OK — trace contains instrumented calls:"
          head -c 500 "$FILE"; echo

  # ───────────────────────────────────────────────────────────────────
  # Scenario 3: one session instruments multiple target kinds
  # ───────────────────────────────────────────────────────────────────
  multi-target-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create multiple Python targets
        run: |
          mkdir -p pkg_one pkg_two tests
          cat > pkg_one/__init__.py <<'EOF'
          def helper_one():
              return "one"

          def run():
              return helper_one()
          EOF
          cat > pkg_two/__init__.py <<'EOF'
          def helper_two():
              return "two"

          def run():
              return helper_two()
          EOF
          cat > standalone.py <<'EOF'
          def inner():
              return "standalone"

          def outer():
              return inner()
          EOF
          cat > tests/test_targets.py <<'EOF'
          import pkg_one
          import pkg_two
          import standalone

          def test_all_targets():
              assert pkg_one.run() == "one"
              assert pkg_two.run() == "two"
              assert standalone.outer() == "standalone"
          EOF
          pip install pytest

      - name: Setup DynaPyt for all targets
        uses: ./
        with:
          targets: |
            directory:pkg_one
            package:pkg_two
            file:standalone.py

      - name: Run all instrumented targets
        run: pytest tests/

      - name: Collect & upload combined trace
        if: always()
        uses: ./
        with:
          mode: collect
          artifact-name: selftest-multi-target-callgraph

      - name: Verify combined trace
        run: |
          FILE="$DYNAPYT_OUTPUT_DIR/dynapyt.json"
          test -s "$FILE"
          grep -q "helper_one" "$FILE"
          grep -q "helper_two" "$FILE"
          grep -q "inner" "$FILE"
